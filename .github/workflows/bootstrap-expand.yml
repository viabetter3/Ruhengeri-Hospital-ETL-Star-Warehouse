name: Expand prepared project
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand prepared archive
        shell: bash
        run: |
          if [ ! -f .upload/project.zip ]; then exit 0; fi
          python - <<'PY'
          from pathlib import Path
          import shutil, zipfile
          root = Path(".")
          temp = root / "_prepared_expand"
          if temp.exists():
              shutil.rmtree(temp)
          with zipfile.ZipFile(root / ".upload" / "project.zip") as z:
              z.extractall(temp)
          children = list(temp.iterdir())
          src = children[0] if len(children) == 1 and children[0].is_dir() else temp
          for item in src.iterdir():
              dst = root / item.name
              if item.is_dir():
                  shutil.copytree(item, dst, dirs_exist_ok=True)
              else:
                  shutil.copy2(item, dst)
          shutil.rmtree(temp, ignore_errors=True)
          shutil.rmtree(root / ".upload", ignore_errors=True)
          shutil.rmtree(root / ".bootstrap", ignore_errors=True)
          PY
      - name: Commit expanded project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add prepared project source"
          git push
